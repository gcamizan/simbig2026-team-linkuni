<link rel="stylesheet" href="asr.css">
</head>
<body>
<header>
  <h1>ASR transcription</h1>
  <p class="sub">Step 2 &middot; the selected clips are sent to the Quechua ASR model in one batch; transcripts appear when the job finishes.</p>
  <p id="mockNote" class="note" hidden>Mock mode: no data is sent to Runpod; transcripts are simulated.</p>
  <p id="pageError" class="note" hidden></p>
</header>

<section id="actions">
  <a href="../">&larr; Back to selection</a>
  <button id="runBtn" disabled>Run ASR</button>

</section>
<p id="asrStatus"></p>

<table>
  <thead>
    <tr><th>Clip</th><th>Reference text</th><th>ASR transcript</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script src="../shared/config.js"></script>
